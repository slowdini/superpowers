# One-off harness descriptor for the investigating-bugs eval suite.
#
# Pass it to EVERY eval-magic command of a run:
#   eval-magic <cmd> --harness-file skills/investigating-bugs/evals/harness/claude-code-utc.toml …
#
# It layers on top of the built-in `claude-code` descriptor (same `label`, so the
# fields below merge field-by-field) and changes the dispatch recipes in exactly
# two ways. Everything else — guard, staging, transcript, model flag — is inherited.
#
# 1. `TZ=UTC` in front of `claude`.
#    The timezone cases only work if the agent's own environment has a zero or
#    positive UTC offset: `bun repro.ts` must come back GREEN so that trusting it
#    is the trap. eval-magic has no UTC default and the agent process inherits the
#    operator's environment, so on a host in a negative-offset zone (e.g.
#    America/New_York) the bug reproduces for free and the case measures nothing.
#    See evals/NOTES.md.
#
# 2. `--setting-sources project,local`.
#    The slow-powers plugin is normally installed on a developer machine, which
#    makes `investigating-bugs` discoverable in BOTH arms and leaves the control
#    arm not actually skill-free. Dropping user-scope settings unloads installed
#    plugins while keeping auth, the env-local write-guard hook
#    (`.claude/settings.local.json`), and the staged skills — the remediation
#    eval-magic's docs/claude-notes.md recommends for exactly this.
#
# Command templates use TOML *literal* strings so shell line-continuation
# backslashes survive verbatim; whitespace matches the built-in templates.

label = "claude-code"

[dispatch]
exec_template = '''
cd <eval-root> && TZ=UTC claude -p --setting-sources project,local --output-format stream-json --verbose --permission-mode acceptEdits{model_arg} \
  "Read the file at <dispatch_prompt_path> and follow its instructions exactly. When you finish, make your final response your closing summary." \
  </dev/null \
  > <outputs_dir>/claude-events.jsonl \
  2> <outputs_dir>/claude-stderr.log'''
parallel_command_template = '''
    cd "$eval_root" && TZ=UTC claude -p --setting-sources project,local --output-format stream-json --verbose --permission-mode acceptEdits{model_arg} \
      "Read the file at $prompt_path and follow its instructions exactly. When you finish, make your final response your closing summary." \
      </dev/null \
      > "$outputs_dir/claude-events.jsonl" \
      2> "$outputs_dir/claude-stderr.log"'''
