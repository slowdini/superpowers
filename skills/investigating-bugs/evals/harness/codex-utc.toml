# One-off Codex override for the investigating-bugs eval suite.
#
# Pass it to every eval-magic command in the run. It pins the dispatch timezone,
# disables live plugins and ambient memories for agent isolation, and joins
# Codex's aggregated command output during transcript extraction. Staging, the
# guard, model flags, and judge dispatch remain inherited.
#
# The timezone cases need the agent to begin in UTC. With a negative host offset,
# the cold bug reproduces for free and the case no longer measures whether the
# agent distrusts a green default-environment reproduction. Descriptor dispatch
# environment applies to both one-shot and scripted rounds and is recorded in the
# run provenance.

label = "codex"

[shadow]
isolates_live_sources = true

[transcript]
events_filename = "codex-events.jsonl"

[transcript.extract.tools]
name_field = "type"
args_omit = ["id", "type", "status", "aggregated_output", "output", "result", "error"]
result_coalesce = ["aggregated_output", "output", "result", "error"]

[dispatch]
exec_template = '''
codex --disable plugins --disable memories --ask-for-approval never exec --cd <eval-root> --sandbox workspace-write{guard_args}{model_arg} --json \
  --output-last-message <outputs_dir>/final-message.md \
  "Read the file at <dispatch_prompt_path> and follow its instructions exactly. When you finish, make your final response exactly the same text you wrote to <outputs_dir>/final-message.md." \
  </dev/null \
  > <outputs_dir>/codex-events.jsonl \
  2> <outputs_dir>/codex-stderr.log'''
parallel_command_template = '''
    codex --disable plugins --disable memories --ask-for-approval never exec --cd "$eval_root" --sandbox workspace-write{guard_args}{model_arg} --json \
      --output-last-message "$outputs_dir/final-message.md" \
      "Read the file at $prompt_path and follow its instructions exactly. When you finish, make your final response exactly the same text you wrote to $outputs_dir/final-message.md." \
      </dev/null \
      > "$outputs_dir/codex-events.jsonl" \
      2> "$outputs_dir/codex-stderr.log"'''

[dispatch.env]
TZ = "UTC"

[conversation]
resume_exec_template = '''
cd <eval-root> && codex --disable plugins --disable memories --ask-for-approval never exec resume{guard_args}{model_arg} --json \
  --output-last-message <outputs_dir>/final-message.md \
  {session_arg} {prompt_arg} \
  </dev/null \
  > <outputs_dir>/codex-events.jsonl \
  2> <outputs_dir>/codex-stderr.log'''
